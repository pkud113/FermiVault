[package]
name = "fermivault"
version = "0.1.0"
description = "Fast, local-first, AI-native Markdown notes"
authors = ["FermiVault contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fermivault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
notify = "8.2.0"
regex = "1.13.1"
toml_edit = "0.25.17"
tauri-plugin-dialog = "2"
model2vec-rs = { version = "0.3.0", default-features = false, features = ["fancy-regex", "local-only"] }
ureq = { version = "3.4.2", features = ["json"] }
sha2 = "0.10"
keyring = "4.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# Release speed for the performance budgets test (tests/budgets.rs), which needs unwinding.
[profile.budgets]
inherits = "release"
panic = "unwind"
lto = "thin"
codegen-units = 16
