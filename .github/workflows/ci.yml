name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  budgets:
    name: Performance budgets (Windows, 10,000 notes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Bench vault
        run: node scripts/bench-vault.mjs "${{ runner.temp }}/bench-vault"
      - name: Build the installer
        run: pnpm tauri build --bundles nsis
      - name: Installer under 15 MB
        shell: pwsh
        run: |
          $f = Get-Item src-tauri/target/release/bundle/nsis/*.exe
          $mb = [math]::Round($f.Length / 1MB, 2)
          "### Installer`n| Budget | Measured | Limit |`n|---|---|---|`n| NSIS installer | $mb MB | 15 MB |" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($f.Length -gt 15MB) { Write-Output "::error::Installer is $mb MB (budget 15 MB)"; exit 1 }
      - name: Search under 30 ms
        working-directory: src-tauri
        env:
          FERMIVAULT_BENCH_VAULT: ${{ runner.temp }}/bench-vault
        run: cargo test --profile budgets --test budgets -- --ignored --nocapture
      - name: Cold start under 400 ms, idle RAM under 150 MB
        shell: pwsh
        run: ./scripts/bench-startup.ps1 -Exe src-tauri/target/release/fermivault.exe -Vault "${{ runner.temp }}/bench-vault"
